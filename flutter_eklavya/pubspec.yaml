name: eklavya
description: "World-class unified mobile welfare and scholarship portal for Scheduled Tribe (ST) students under Ministry of Tribal Affairs (MoTA) - SIH 2026."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Navigation & Routing
  go_router: ^14.2.0
  # State Management
  flutter_riverpod: ^2.5.1
  # Networking & HTTP
  http: ^1.2.1
  # Typography & Design
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
